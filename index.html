<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>netmap</title>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<style>
:root{
  --bg:#0a0e13;--s1:#10151c;--s2:#161d26;--s3:#1d2630;--line:#232d3a;--line2:#2e3a49;
  --fg:#e6edf3;--mut:#8593a6;--dim:#5b6878;--acc:#4f8cff;--acc2:#4f8cff22;
  --ok:#34d399;--warn:#fbbf24;--bad:#f87171;
  --r:10px;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:var(--s2);border:1px solid var(--line2);border-radius:8px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s}
button:hover{background:var(--s3);border-color:var(--dim)}
button.on{background:var(--acc2);border-color:var(--acc);color:#cfe0ff}
button.primary{background:var(--acc);border-color:var(--acc);color:#fff}button.primary:hover{background:#6b9dff}
button:disabled{opacity:.5;cursor:default}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:6px 10px;width:100%}
input:focus,textarea:focus{border-color:var(--acc);outline:none}
.ic{width:15px;height:15px;flex:none}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--mut)}.sm{font-size:11.5px}
a{color:var(--acc);text-decoration:none}a:hover{text-decoration:underline}

/* header */
header{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--s1)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;letter-spacing:-.01em}
.brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#4f8cff,#7c5cff);display:grid;place-items:center;color:#fff}
.netpill{display:flex;gap:10px;align-items:center;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.netpill b{color:var(--fg);font-family:var(--mono);font-weight:500}
.sp{flex:1}
.scanst{display:flex;align-items:center;gap:7px;color:var(--mut);white-space:nowrap}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 #34d39980}
.pulse.busy{background:var(--acc);animation:ping 1.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 #4f8cffaa}100%{box-shadow:0 0 0 9px #4f8cff00}}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:calc(100% + 6px);background:var(--s2);border:1px solid var(--line2);border-radius:10px;padding:5px;z-index:20;min-width:150px;box-shadow:0 12px 30px #0008}
.menu.open .pop{display:block}
.pop button{width:100%;border:0;background:none;justify-content:flex-start}.pop button:hover{background:var(--s3)}

#err{display:none;background:#2a1516;color:#fecaca;padding:8px 16px;border-bottom:1px solid #7f1d1d}

/* stats */
.stats{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--s1);overflow-x:auto}
.card{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:9px 12px;display:grid;grid-template-columns:1fr auto;align-items:end;gap:2px 10px;min-width:0}
.card .k{grid-column:1/-1;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.card .v{font-size:20px;font-weight:650;letter-spacing:-.02em;white-space:nowrap}
.card .v small{font-size:12px;color:var(--mut);font-weight:500;margin-left:3px}
.card .d{grid-column:1/-1;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card svg{display:block}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line2)}

/* main */
main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 460px;min-height:0}
.canvas{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 40%,#111a26 0,var(--bg) 70%)}
.canvas::before{content:"";position:absolute;inset:0;background-image:radial-gradient(#ffffff0d 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
#graph{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
#graph:active{cursor:grabbing}
.tools{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap;z-index:5}
.group{display:flex;background:var(--s1);border:1px solid var(--line2);border-radius:9px;padding:2px;gap:2px;box-shadow:0 4px 14px #0006}
.group button{border:0;background:none;border-radius:7px;padding:5px 9px}
.group button:hover{background:var(--s3)}.group button.on{background:var(--acc2);color:#cfe0ff}
#tip{position:absolute;pointer-events:none;z-index:10;background:#0d131bf2;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;min-width:190px;max-width:280px;box-shadow:0 12px 30px #000a;display:none;font-size:12px}
#tip h4{margin:0 0 5px;font-size:13px}
#tip .row{display:flex;justify-content:space-between;gap:12px}#tip .row span:first-child{color:var(--mut)}
#legend{position:absolute;left:12px;bottom:12px;background:#10151cf0;border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:11.5px;display:none;z-index:5;max-width:min(520px,calc(100% - 24px))}
#legend.show{display:block}
#legend .sw{display:inline-flex;align-items:center;gap:5px;margin:2px 10px 2px 0;white-space:nowrap}
#legend .ln{display:inline-block;width:22px;height:0;border-top:2px solid;vertical-align:middle;margin-right:4px}
#empty{position:absolute;inset:0;display:none;place-items:center;text-align:center;color:var(--mut);pointer-events:none}
#empty.show{display:grid}
.radar{width:120px;height:120px;border-radius:50%;margin:0 auto 14px;border:1px solid #4f8cff55;position:relative;background:radial-gradient(circle,#4f8cff22 0,transparent 70%)}
.radar::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#4f8cff66,transparent 25%);animation:spin 1.6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wan{animation:flow linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}
.newring{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{stroke-opacity:.15}}

/* side panel */
aside{min-width:0;min-height:0;border-left:1px solid var(--line);background:var(--s1);display:flex;flex-direction:column}
nav{display:flex;gap:2px;padding:8px 10px 0;border-bottom:1px solid var(--line)}
nav button{border:0;background:none;border-radius:8px 8px 0 0;padding:8px 12px;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px}
nav button:hover{background:none;color:var(--fg)}
nav button.on{color:var(--fg);border-bottom-color:var(--acc);background:none}
.badge{background:var(--s3);color:var(--mut);border-radius:999px;padding:0 6px;font-size:11px;font-weight:600}
.badge.hot{background:var(--warn);color:#1a1300}
.tab{display:none;overflow:auto;flex:1;min-height:0}.tab.on{display:block}
.bar{display:flex;gap:8px;padding:10px 12px;position:sticky;top:0;background:var(--s1);z-index:2;border-bottom:1px solid var(--line)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:2px;flex:none}
.seg button{border:0;background:none;padding:3px 9px;border-radius:6px;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--fg)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
#devices col.a{width:132px}#devices col.r{width:58px}#devices col.p{width:52px}
th{position:sticky;top:53px;background:var(--s1);z-index:1;text-align:left;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;user-select:none;white-space:nowrap}
th:hover{color:var(--fg)}th .arr{opacity:.7}
td{padding:8px 10px;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .1s}
tbody tr:hover{background:var(--s2)}tbody tr.sel{background:var(--acc2);box-shadow:inset 3px 0 0 var(--acc)}
.dev{display:flex;align-items:center;gap:10px;min-width:0}
.dev .nm,.dev .mut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dev .nm{font-weight:550}
.av{position:relative;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--c)}
.av .ic{width:16px;height:16px}
.av i{position:absolute;right:-2px;bottom:-2px;width:9px;height:9px;border-radius:50%;border:2px solid var(--s1)}
.st-online{background:var(--ok)}.st-stale{background:var(--warn)}.st-offline{background:var(--dim)}
.rtt{font-family:var(--mono);font-size:12px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--s2);border:1px solid var(--line2);border-radius:6px;padding:1px 7px;margin:2px 4px 2px 0;font-size:11.5px}
.chip b{font-family:var(--mono);font-weight:600}
a.chip:hover{border-color:var(--acc);text-decoration:none}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}

/* details */
.det{padding:14px}
.dhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.dhead .av{width:46px;height:46px;border-radius:12px}.dhead .av .ic{width:24px;height:24px}
.dhead h2{margin:0;font-size:17px;letter-spacing:-.01em;word-break:break-all}
.pillst{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:1px 8px;font-size:11.5px;font-weight:600;background:var(--s3)}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.sec{background:var(--s2);border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);font-weight:600;display:flex;justify-content:space-between}
.kv{display:grid;grid-template-columns:96px 1fr;gap:5px 10px}
.kv dt{color:var(--mut)}.kv dd{margin:0;word-break:break-all}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px;text-align:center}
.mini div{background:var(--bg);border-radius:7px;padding:5px}.mini b{display:block;font-family:var(--mono);font-size:12.5px}.mini span{font-size:10.5px;color:var(--mut)}
.hop{display:grid;grid-template-columns:22px 1fr 60px 70px;gap:8px;align-items:center;font-family:var(--mono);font-size:12px;padding:2px 0}
.hbar{height:5px;border-radius:3px;background:var(--acc)}
.spin{width:14px;height:14px;border:2px solid #fff4;border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}

/* activity & events */
.proc{display:grid;grid-template-columns:130px 1fr 30px;gap:8px;align-items:center;padding:3px 0;font-size:12px}
.proc .t{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--acc),#7c5cff)}
.ev{display:flex;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ev:hover{background:var(--s2)}
.ev .lv{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.lv-info{background:var(--acc)}.lv-warn{background:var(--warn)}.lv-error{background:var(--bad)}
.ev .when{margin-left:auto;color:var(--dim);white-space:nowrap;font-size:11.5px}

#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:50}
.toast{background:var(--s2);border:1px solid var(--line2);border-left:3px solid var(--acc);border-radius:9px;padding:9px 12px;max-width:340px;box-shadow:0 12px 30px #000a;animation:tin .2s ease-out}
.toast.warn{border-left-color:var(--warn)}.toast.error{border-left-color:var(--bad)}
@keyframes tin{from{transform:translateY(8px);opacity:0}}

@media (max-width:1000px){
  body{overflow:auto;height:auto}
  .stats{grid-template-columns:repeat(5,170px)}
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:62vh auto}
  aside{border-left:0;border-top:1px solid var(--line);max-height:none}
  .netpill{display:none}
  header{flex-wrap:wrap;gap:8px 10px}.scanst{order:5;width:100%}
  .tools{gap:4px}.group button{padding:4px 7px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="icons"></defs></svg>

<header>
  <div class="brand"><span class="logo"><svg class="ic"><use href="#i-share"/></svg></span>netmap</div>
  <div class="netpill" id="net">starting…</div>
  <span class="sp"></span>
  <div class="scanst" id="scanst"><span class="pulse" id="pulse"></span><span id="scantxt">–</span></div>
  <button class="primary" id="bScan" title="Rescan now (r)"><svg class="ic"><use href="#i-refresh"/></svg>Rescan</button>
  <div class="menu" id="expMenu">
    <button id="bExp" aria-haspopup="true"><svg class="ic"><use href="#i-download"/></svg>Export</button>
    <div class="pop" role="menu">
      <button data-x="png">Topology · PNG</button><button data-x="svg">Topology · SVG</button>
      <button data-x="csv">Inventory · CSV</button><button data-x="json">Full state · JSON</button>
    </div>
  </div>
</header>
<div id="err" role="alert"></div>

<section class="stats">
  <div class="card click" data-go="devices"><div class="k">Devices online</div><div class="v" id="stDev">–</div><div class="d" id="stDevD"></div></div>
  <div class="card"><div class="k">Gateway latency</div><div class="v" id="stGw">–</div><svg id="spGw" width="80" height="28"></svg><div class="d" id="stGwD"></div></div>
  <div class="card"><div class="k">Throughput</div><div class="v" id="stTp">–</div><svg id="spTp" width="80" height="28"></svg><div class="d" id="stTpD"></div></div>
  <div class="card click" data-go="activity"><div class="k">Connections</div><div class="v" id="stCn">–</div><div class="d" id="stCnD"></div></div>
  <div class="card click" data-go="events"><div class="k">Alerts</div><div class="v" id="stAl">–</div><div class="d" id="stAlD"></div></div>
</section>

<main>
  <div class="canvas" id="canvas">
    <svg id="graph" role="img" aria-label="Network topology"></svg>
    <div class="tools">
      <div class="group" id="layout"><button data-v="radial" class="on" title="Devices in a ring around the gateway">Radial</button><button data-v="force" title="Physics layout, drag to pin">Force</button></div>
      <div class="group">
        <button id="bConns" title="Draw this host's live TCP connections"><svg class="ic"><use href="#i-activity"/></svg>Connections</button>
        <button id="bOff" class="on" title="Show offline devices">Offline</button>
        <button id="bLeg" title="Legend">Legend</button>
      </div>
      <div class="group">
        <button id="zIn" aria-label="Zoom in">+</button><button id="zOut" aria-label="Zoom out">−</button>
        <button id="zFit" title="Fit to view (f)"><svg class="ic"><use href="#i-fit"/></svg></button>
      </div>
    </div>
    <div id="tip"></div>
    <div id="legend"></div>
    <div id="empty"><div><div class="radar"></div><div id="emptyTxt">Discovering devices…</div></div></div>
  </div>

  <aside>
    <nav>
      <button data-t="devices" class="on">Devices <span class="badge" id="bdDev">0</span></button>
      <button data-t="details">Details</button>
      <button data-t="activity">Activity <span class="badge" id="bdAct">0</span></button>
      <button data-t="events">Events <span class="badge" id="bdEv">0</span></button>
    </nav>
    <div class="tab on" id="devices">
      <div class="bar">
        <input id="filter" type="search" placeholder="Search ip, name, vendor, port…  ( / )" aria-label="Filter devices">
        <div class="seg" id="stFilter"><button data-v="all" class="on">All</button><button data-v="online">Up</button><button data-v="offline">Down</button></div>
      </div>
      <table><colgroup><col><col class="a"><col class="r"><col class="p"></colgroup><thead><tr><th data-k="name">Device</th><th data-k="ip">Address</th><th data-k="rtt">RTT</th><th data-k="ports">Ports</th></tr></thead><tbody id="devBody"></tbody></table>
    </div>
    <div class="tab" id="details"><div class="empty">Select a device on the map or in the list.</div></div>
    <div class="tab" id="activity"></div>
    <div class="tab" id="events">
      <div class="bar"><div class="seg" id="evFilter"><button data-v="all" class="on">All</button><button data-v="warn">Warnings</button></div></div>
      <div id="evBody"></div>
    </div>
  </aside>
</main>
<div id="toasts" aria-live="polite"></div>

<script>
const $ = s => document.querySelector(s), $$ = s => document.querySelectorAll(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const C = {bg:'#0a0e13', s1:'#10151c', fg:'#e6edf3', mut:'#8593a6', dim:'#5b6878', acc:'#4f8cff', ok:'#34d399', warn:'#fbbf24', bad:'#f87171'};

// 24px stroke icons
const ICONS = {
  internet:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
  router:'<rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 16.5h.01M11 16.5h.01M12 13V9M8.5 7.5a5 5 0 0 1 7 0M6 5a8.5 8.5 0 0 1 12 0"/>',
  'this-host':'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/>',
  computer:'<rect x="4" y="5" width="16" height="10" rx="1.5"/><path d="M2 19h20"/>',
  server:'<rect x="3" y="3.5" width="18" height="7" rx="2"/><rect x="3" y="13.5" width="18" height="7" rx="2"/><path d="M7 7h.01M7 17h.01"/>',
  phone:'<rect x="7" y="2.5" width="10" height="19" rx="2.5"/><path d="M11 18h2"/>',
  printer:'<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>',
  media:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M8 2.5l4 3.5 4-3.5M8 21h8"/>',
  camera:'<path d="M3 8h3.5L8.5 5h7l2 3H21v11H3z"/><circle cx="12" cy="13" r="3.5"/>',
  iot:'<rect x="6.5" y="6.5" width="11" height="11" rx="2"/><path d="M10 2.5v4M14 2.5v4M10 17.5v4M14 17.5v4M2.5 10h4M2.5 14h4M17.5 10h4M17.5 14h4"/>',
  network:'<rect x="2.5" y="8" width="19" height="8" rx="2"/><path d="M6.5 12h.01M10 12h.01M13.5 12h.01M17 12h.01"/>',
  remote:'<path d="M7 18.5a4.5 4.5 0 1 1 .9-8.9A6 6 0 0 1 19.3 11a3.8 3.8 0 0 1-.8 7.5z"/>',
  unknown:'<circle cx="12" cy="12" r="9"/><path d="M9.6 9.2a2.5 2.5 0 1 1 3.4 2.4c-.6.3-1 .8-1 1.5v.4M12 16.8h.01"/>',
  hop:'<circle cx="12" cy="12" r="3"/>',
  share:'<circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.2 10.8l7.6-3.6M8.2 13.2l7.6 3.6"/>',
  refresh:'<path d="M20 11a8 8 0 0 0-14.3-4.9L4 8M4 4v4h4M4 13a8 8 0 0 0 14.3 4.9L20 16M20 20v-4h-4"/>',
  download:'<path d="M12 3v12M7 10l5 5 5-5M4 20h16"/>',
  fit:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  activity:'<path d="M3 12h4l3-8 4 16 3-8h4"/>',
  copy:'<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
  terminal:'<path d="M4 17l6-5-6-5M12 19h8"/>',
  radar:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6-6"/>',

$('#icons').innerHTML = Object.entries(ICONS).map(([k, p]) =>

    $('#dLabel').value = d.label || ''; $('#dNotes').value = d.notes || '';
    $('#dSave').onclick = async () => {
      const r = await post('/api/device', {ip: d.ip, label: $('#dLabel').value, notes: $('#dNotes').value});
      $('#dSaved').textContent = r.ok ? 'Saved ✓' : 'Save failed'; refresh();
    };
    const web = (d.ports || []).find(p => WEB.has(p));
    $('#dAct').innerHTML = `<button id="dProbe" class="primary">${icon('radar')}Deep probe</button>
      ${web ? `<a href="${[443, 8443].includes(web) ? 'https' : 'http'}://${esc(d.ip)}:${web}" target="_blank" rel="noopener"><button>${icon('ext')}Open web UI</button></a>` : ''}
      <button data-copy="${esc(d.ip)}">${icon('copy')}Copy IP</button>
      ${(d.ports || []).includes(22) ? `<button data-copy="ssh ${esc(d.ip)}">${icon('terminal')}Copy ssh</button>` : ''}
      ${d.mac ? `<button data-copy="${esc(d.mac)}">${icon('copy')}Copy MAC</button>` : ''}`;
    $('#dProbe').onclick = () => probe(d.ip);
  }
  $('#dHead').innerHTML = `<div class="dhead">${av(d)}<div style="min-width:0"><h2>${esc(nm(d))}</h2>
    <div class="mut"><span class="pillst" style="color:${({online: C.ok, stale: C.warn, offline: C.mut})[d.status]}">● ${d.status}</span>
    ${esc((TYPES[d.type] || TYPES.unknown)[1])} · seen via ${(d.seen_by || []).join(', ') || '–'}</div></div></div>`;
  const h = d.rtt_hist || [], ok = h.filter(v => v != null);
  const jit = ok.length > 1 ? d3.mean(ok.slice(1).map((v, i) => Math.abs(v - ok[i]))) : null;
  const loss = h.length ? Math.round(100 * (h.length - ok.length) / h.length) : null;
  const conns = st.S.conns.filter(c => c.remote === d.ip);
  $('#dInfo').innerHTML = `<div class="sec"><h3>Identity</h3><dl class="kv">
      <dt>IP</dt><dd class="mono">${esc(d.ip)}</dd><dt>MAC</dt><dd class="mono">${esc(d.mac || '–')}</dd>
      <dt>Vendor</dt><dd>${esc(d.vendor || '–')}</dd><dt>Hostname</dt><dd>${esc(d.hostname || '–')}</dd>
      <dt>First seen</dt><dd>${new Date(d.first_seen * 1000).toLocaleString()}</dd><dt>Last seen</dt><dd>${ago(d.last_seen)}</dd></dl></div>
    <div class="sec"><h3>Latency <span>${h.length} scans</span></h3><svg id="dSpark" width="100%" height="44" viewBox="0 0 400 44" preserveAspectRatio="none"></svg>
      <div class="mini"><div><b style="color:${rttC(d.rtt)}">${d.rtt != null ? d.rtt.toFixed(1) : '–'}</b><span>now ms</span></div>
      <div><b>${ok.length ? d3.mean(ok).toFixed(1) : '–'}</b><span>avg ms</span></div>
      <div><b>${jit != null ? jit.toFixed(1) : '–'}</b><span>jitter ms</span></div>
      <div><b style="color:${loss ? C.warn : C.fg}">${loss ?? '–'}${loss != null ? '%' : ''}</b><span>loss</span></div></div></div>
    <div class="sec"><h3>Open ports <span>${(d.ports || []).length}</span></h3>${(d.ports || []).map(p => WEB.has(p)
      ? `<a class="chip" target="_blank" rel="noopener" href="${[443, 8443].includes(p) ? 'https' : 'http'}://${esc(d.ip)}:${p}"><b>${p}</b>${SVC[p] || ''} ↗</a>`
      : `<span class="chip"><b>${p}</b>${SVC[p] || ''}</span>`).join('') || '<span class="mut">none of the common ports — try Deep probe</span>'}</div>
    ${conns.length ? `<div class="sec"><h3>Live connections from this host</h3>${conns.map(c => `<div class="mono sm">${esc(c.proc)} → :${c.rport} ${SVC[c.rport] || ''}</div>`).join('')}</div>` : ''}`;
  spark('#dSpark', [{v: h, c: C.acc}], 400, 44);
}

async function probe(ip) {
  const b = $('#dProbe'); b.disabled = true; b.innerHTML = '<span class="spin"></span>Probing…';
  $('#dOut').innerHTML = '<div class="sec mut">Running ping ×5, traceroute and a TCP 1–1024 scan (10–30s)…</div>';
  try {
    const r = await (await fetch('/api/probe?ip=' + encodeURIComponent(ip))).json();
    if (st.sel !== ip) return;
    const mx = d3.max(r.traceroute || [], h => h.rtt) || 1;
    $('#dOut').innerHTML = r.error ? `<div class="sec" style="color:${C.bad}">${esc(r.error)}</div>` : `
      <div class="sec"><h3>Ping</h3><div class="mono sm">${esc(r.ping) || 'no reply'}</div></div>
      <div class="sec"><h3>Traceroute <span>${r.traceroute.length} hops</span></h3>${r.traceroute.map(h => `<div class="hop"><span class="mut">${h.hop}</span><span>${esc(h.ip || '*')}</span>
        <span>${h.rtt != null ? h.rtt.toFixed(1) + ' ms' : ''}</span><div class="hbar" style="width:${h.rtt ? Math.max(4, 70 * h.rtt / mx) : 0}px"></div></div>`).join('')}</div>
      <div class="sec"><h3>Open TCP ports <span>${r.ports.length}</span></h3>${r.ports.map(p => `<span class="chip"><b>${p.port}</b>${esc(p.service)}</span>`).join('') || '<span class="mut">none</span>'}</div>`;
  } catch (e) { $('#dOut').innerHTML = `<div class="sec" style="color:${C.bad}">Probe failed: ${esc(e.message)}</div>`; }
  finally { if ($('#dProbe')) { $('#dProbe').disabled = false; $('#dProbe').innerHTML = icon('radar') + 'Deep probe'; } }
}

function drawActivity() {
  const cs = st.S.conns;
  if (!cs.length) { $('#activity').innerHTML = '<div class="empty">No established TCP connections from this host.</div>'; return; }
  const procs = d3.rollups(cs, v => v.length, c => c.proc).sort((a, b) => b[1] - a[1]), mx = procs[0][1];
  const agg = d3.rollups(cs, v => ({...v[0], n: v.length}), c => c.proc + '|' + c.remote + '|' + c.rport).map(x => x[1]).sort((a, b) => b.n - a.n);
  $('#activity').innerHTML = `<div class="det"><div class="sec"><h3>By process <span>${cs.length} sockets · ${new Set(cs.map(c => c.remote)).size} hosts</span></h3>
    ${procs.slice(0, 8).map(([p, n]) => `<div class="proc"><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(p)}</span><div class="t" style="width:${100 * n / mx}%"></div><span class="mono mut">${n}</span></div>`).join('')}</div></div>
    <table><thead><tr><th style="top:0">Process</th><th style="top:0">Remote</th><th style="top:0">Service</th><th style="top:0">#</th></tr></thead><tbody>
    ${agg.map(c => `<tr data-ip="${esc(c.remote)}"><td><b style="font-weight:550">${esc(c.proc)}</b><div class="mut sm">pid ${c.pid ?? '?'}</div></td>
      <td class="mono" style="word-break:break-all">${esc(c.rname || c.remote)}${c.rname ? `<div class="mut sm">${esc(c.remote)}</div>` : ''}</td>
      <td class="mono">${c.rport}<div class="mut sm">${SVC[c.rport] || ''}</div></td><td class="mono">${c.n}</td></tr>`).join('')}</tbody></table>`;
}

function drawEvents() {
  const evs = st.S.events.slice().reverse().filter(e => st.evF === 'all' || e.level !== 'info');
  $('#evBody').innerHTML = evs.map(e => `<div class="ev" data-ip="${esc(e.ip || '')}"><span class="lv lv-${e.level}"></span><div>${esc(e.msg)}</div>
    <span class="when" title="${new Date(e.t * 1000).toLocaleString()}">${ago(e.t)}</span></div>`).join('') || '<div class="empty">No events yet.</div>';
}

function toasts() {
  const evs = st.S.events, lastT = evs.length ? evs[evs.length - 1].t : 0;
  if (st.lastEvT !== null) for (const e of evs.filter(e => e.t > st.lastEvT).slice(-3)) {
    const el = Object.assign(document.createElement('div'), {className: 'toast ' + e.level, textContent: e.msg});
    $('#toasts').append(el); setTimeout(() => el.remove(), 6000);
  }
  st.lastEvT = lastT;
}

// ---------------- state / render loop ----------------
function tab(t) {
  $$('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $$('.tab').forEach(x => x.classList.toggle('on', x.id === t));
  if (t === 'events' && st.S) { st.seenEv = st.S.events.length; drawHeader(); }
}
function select(ip) { if (!st.S.devices.some(d => d.ip === ip)) return; st.sel = ip; tab('details'); render(true); }
function deselect() { st.sel = null; st.detailsFor = null; $('#details').innerHTML = '<div class="empty">Select a device on the map or in the list.</div>'; render(true); }
async function post(u, b) { try { const r = await fetch(u, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(b)}); return {ok: r.ok}; } catch { return {ok: false}; } }

function render(force) {   // only touch the DOM for parts whose data changed
  const S = st.S; if (!S) return;
  if (force) st.last = {};
  drawHeader();
  const view = [st.layout, st.conns, st.off, st.sel];
  if (changed('graph', [S.devices, S.path, st.conns ? S.conns.map(c => c.remote + c.proc) : 0, view]) ) drawGraph();
  else if (changed('traffic', Math.round(Math.log2(1 + S.traffic.rx_bps + S.traffic.tx_bps)))) drawGraph();
  if (changed('devs', [S.devices, $('#filter').value, st.sort, st.stF, st.sel])) drawDevices();
  if (st.sel && changed('det', [S.devices.find(d => d.ip === st.sel), S.conns.filter(c => c.remote === st.sel)])) drawDetails();
  if (changed('act', S.conns)) drawActivity();
  if (changed('ev', [S.events.length, S.events[S.events.length - 1]?.t, st.evF, Math.floor(Date.now() / 30000)])) drawEvents();
  toasts();
}

let timer, inflight = false;
async function refresh() {
  clearTimeout(timer);
  if (!inflight && !(document.hidden && st.S)) {   // always load once; then pause while the tab is hidden
    inflight = true;
    try {
      st.S = await (await fetch('/api/state')).json();
      if (st.seenEv === 0) st.seenEv = st.S.events.length;
      render();
    } catch { $('#err').style.display = 'block'; $('#err').textContent = 'Lost connection to the netmap server — retrying…'; }
    inflight = false;
  }
  timer = setTimeout(refresh, st.S?.meta.scanning ? 1000 : 2000);
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });   // polling pauses while hidden
setInterval(scanStatus, 1000);

// ---------------- wiring ----------------
$$('nav button').forEach(b => b.onclick = () => tab(b.dataset.t));
$$('.card[data-go]').forEach(c => c.onclick = () => tab(c.dataset.go));
const rowSelect = e => { const r = e.target.closest('[data-ip]'); if (r && r.dataset.ip && !e.target.closest('a,button')) select(r.dataset.ip); };
['#devBody', '#evBody', '#activity'].forEach(s => $(s).addEventListener('click', rowSelect));
$('#details').addEventListener('click', async e => {
  const b = e.target.closest('[data-copy]'); if (!b) return;
  try { await navigator.clipboard.writeText(b.dataset.copy); toast('Copied ' + b.dataset.copy); } catch { toast('Clipboard unavailable'); }
});
const toast = msg => { const el = Object.assign(document.createElement('div'), {className: 'toast', textContent: msg}); $('#toasts').append(el); setTimeout(() => el.remove(), 2500); };
$('#filter').oninput = () => render();
$$('#devices th').forEach(th => th.onclick = () => { const k = th.dataset.k; st.sort = {k, dir: st.sort.k === k ? -st.sort.dir : 1}; render(); });
const seg = (sel, fn) => $$(sel + ' button').forEach(b => b.onclick = () => { $$(sel + ' button').forEach(x => x.classList.toggle('on', x === b)); fn(b.dataset.v); render(); });
seg('#stFilter', v => st.stF = v);
seg('#evFilter', v => st.evF = v);
seg('#layout', v => { st.layout = v; nodeMap.forEach(n => n.pinned = false); didFit = false; });
$('#bConns').onclick = e => { st.conns = !st.conns; e.currentTarget.classList.toggle('on', st.conns); didFit = false; render(); };
$('#bOff').onclick = e => { st.off = !st.off; e.currentTarget.classList.toggle('on', st.off); render(); };
$('#bLeg').onclick = e => e.currentTarget.classList.toggle('on', $('#legend').classList.toggle('show'));
$('#zIn').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1.3);
$('#zOut').onclick = () => svg.transition().duration(200).call(zoom.scaleBy, 1 / 1.3);
$('#zFit').onclick = () => fit();
$('#bScan').onclick = async () => { await post('/api/scan', {}); if (st.S) { st.S.meta.scanning = true; scanStatus(); } setTimeout(refresh, 300); };
$('#bExp').onclick = e => { e.stopPropagation(); $('#expMenu').classList.toggle('open'); };
document.addEventListener('click', () => $('#expMenu').classList.remove('open'));
$$('#expMenu .pop button').forEach(b => b.onclick = () => exportAs(b.dataset.x));

function exportAs(kind) {
  const stamp = new Date().toISOString().slice(0, 19).replace(/:/g, ''), fn = `netmap-${stamp}.${kind}`;
  const dl = href => Object.assign(document.createElement('a'), {href, download: fn}).click();
  if (kind === 'csv') return dl('/api/export.csv');
  if (kind === 'json') return dl(URL.createObjectURL(new Blob([JSON.stringify(st.S, null, 2)], {type: 'application/json'})));
  const c = $('#graph').cloneNode(true), vb = c.getAttribute('viewBox').split(',').map(Number);
  c.setAttribute('xmlns', 'http://www.w3.org/2000/svg'); c.setAttribute('width', vb[2]); c.setAttribute('height', vb[3]);
  c.insertAdjacentHTML('afterbegin', `<defs>${$('#icons').innerHTML}</defs><rect x="${vb[0]}" y="${vb[1]}" width="${vb[2]}" height="${vb[3]}" fill="${C.bg}"/>`);
  const url = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(c)], {type: 'image/svg+xml'}));
  if (kind === 'svg') return dl(url);
  const img = new Image();
  img.onload = () => { const cv = Object.assign(document.createElement('canvas'), {width: vb[2] * 2, height: vb[3] * 2}), x = cv.getContext('2d');
    x.scale(2, 2); x.drawImage(img, 0, 0); cv.toBlob(b => dl(URL.createObjectURL(b))); };
  img.src = url;
}

addEventListener('keydown', e => {
  if (e.target.matches('input,textarea') || e.metaKey || e.ctrlKey) return;
  if (e.key === '/') { e.preventDefault(); tab('devices'); $('#filter').focus(); }
  else if (e.key === 'r') $('#bScan').click();
  else if (e.key === 'f') fit();
  else if (e.key === 'Escape') deselect();
  else if ('1234'.includes(e.key)) tab(['devices', 'details', 'activity', 'events'][+e.key - 1]);
});

$('#legend').innerHTML = `<div style="margin-bottom:6px">${Object.entries(TYPES).filter(([k]) => k !== 'hop').map(([k, [c, l]]) =>
    `<span class="sw" style="color:${c}">${icon(k)}<span style="color:var(--fg)">${l}</span></span>`).join('')}</div>
  <div class="mut"><span class="sw"><span class="ln" style="border-color:${C.ok}"></span>&lt;10 ms</span><span class="sw"><span class="ln" style="border-color:${C.warn}"></span>&lt;100 ms</span>
  <span class="sw"><span class="ln" style="border-color:${C.bad}"></span>slow</span><span class="sw"><span class="ln" style="border-color:${C.mut};border-top-style:dashed"></span>stale ARP</span>
  <span class="sw"><span class="ln" style="border-color:#7c9cff;border-top-width:4px"></span>WAN (width = traffic)</span></div>
  <div class="mut" style="margin-top:4px">Keys: <b>/</b> search · <b>r</b> rescan · <b>f</b> fit · <b>1–4</b> tabs · <b>Esc</b> deselect · drag to pin (force layout), double-click to release</div>`;
refresh();
</script>
</body>
</html>
